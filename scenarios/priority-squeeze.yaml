name: priority-squeeze
description: A high-priority stream scales up on a full node; preemption evicts the low-priority batch pods.
story: The nightly ETL has run fine for months. Tonight the high-priority payment stream had a burst — and the ETL took three times as long.
look_for:
  - consumers_scaled followed by pod_preempted on the ETL pods
  - ETL progress is lost at each preemption and its run time explodes
  - nothing changed in the ETL job itself
duration: 2h                                   # how long the scenario runs
day_length: 2h                                 # a 24 h day is squeezed into this time
day_start_hour: 0                              # day time when the scenario starts
seed: 42                                       # day number for the random choices (same seed = same plan)
capacity_hint: {cpu: 6, memory: 16Gi}          # the machine size this scenario is written for
preemption: on                                 # may high-priority pods push out lower-priority ones?
placement: {mode: together}                    # together = all pods on one machine
loads:
  - name: nightly-etl
    type: batch
    team: data                                 # who owns it
    every: 3h                                  # a new run is due this often
    first: 5m                                  # the first run is due at this time
    jitter: 0m                                 # each run starts up to this much later (random, from the seed)
    work: {units: 2400, unit: table, cost_per_unit: 4.0s} # 2400 × 4 s = 9600 CPU-s → normal run ≈ 40.0 min on 4 cores
    work_spread: 0%                            # each run gets ± this much work (random, from the seed)
    parallelism: 4                             # pods working on one run
    intensity: 1.0                             # cores each pod tries to use
    request: 1                                 # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: low                              # high | normal | low (who may push out whom)
    concurrency_policy: allow                  # previous run still working? allow | forbid | replace
    max_concurrent_runs: null                  # no limit on runs at the same time
    deadline_factor: 4                         # a run is stopped after this × its normal time
    checkpoint: false                          # keep finished work when a pod is killed?
    memory: {request: 256Mi, limit: 1Gi, base: 200Mi, peak: 400Mi, shape: ramp} # memory: booked, max, at start, peak, how it grows
    health: {metric: runtime_ratio, threshold: 1.5} # unhealthy if a run takes > 1.5 × its normal time
  - name: payments
    type: stream
    team: payments                             # who owns it
    base_rate: 50                              # events per second → 50 × 10 ms = 0.50 cores
    daily_pattern: flat                        # how the level changes over the day
    bursts: {at: [20m, 55m], x: 8, length: [8m, 8m], per_hour: 0} # random/fixed bursts: per_hour, x = how many times more events, length
    work_per_event: 10ms                       # CPU work for one event
    partitions: 8                              # events are split over this many partitions
    consumers: [1, 8]                          # [min, max] consumer pods
    threads_per_consumer: 1                    # events one consumer pod handles at once
    prefetch: 50                               # events a consumer takes at once
    scaler: {name: target-tracking, cpu_target: 70, backlog_per_consumer: 100, stabilization: 3m} # how pods are added and removed
    request: 500m                              # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: high                             # high | normal | low (who may push out whom)
    memory: {request: 128Mi, limit: 512Mi, base: 100Mi, per_buffered_event: 2Ki} # memory: booked, max, base, per waiting event
    health: {metric: event_age, threshold: 30s} # unhealthy if the oldest event waits > 30s
