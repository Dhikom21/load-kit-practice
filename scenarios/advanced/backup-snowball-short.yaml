name: backup-snowball-short
set: teaching                                  # teaching = short version (20-30 min); full = long version
description: (30-min teaching version) A backup every 15 min that normally takes 12 min; a busy period makes runs overlap and pile up.
story: The backup is scheduled every 15 minutes and has always fitted. Today a training run made it a little slower — and nobody changed anything.
look_for:
  - the backup's run time grows run after run; several runs are active at once (run_overlapped)
  - the pile-up continues after the training run has finished
  - the attribution names the backup's own earlier runs as a cause, not only the training job
duration: 30m                                  # how long the scenario runs
day_length: 30m                                # a 24 h day is squeezed into this time
day_start_hour: 1                              # day time when the scenario starts
seed: 42                                       # day number for the random choices (same seed = same plan)
capacity_hint: {cpu: 3, memory: 8Gi}           # the machine size this scenario is written for
phases: {warmup: 1m, baseline: 2m, drain: 5m}  # warm-up, baseline and drain for this scenario
preemption: off                              # may high-priority pods push out lower-priority ones?
placement: {mode: together}                    # together = all pods on one machine
loads:
  - name: backup
    type: batch
    team: it                                   # who owns it
    every: 225s                                # a new run is due this often
    first: 15s                                 # the first run is due at this time
    jitter: 0m                                 # each run starts up to this much later (random, from the seed)
    work: {units: 180, unit: file, cost_per_unit: 1.0s} # 180 × 1 s = 180 CPU-s → normal run ≈ 3.0 min on 1 core
    work_spread: 0%                            # each run gets ± this much work (random, from the seed)
    parallelism: 1                             # pods working on one run
    intensity: 1.0                             # cores each pod tries to use
    request: 250m                              # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: normal                           # high | normal | low (who may push out whom)
    concurrency_policy: allow                  # previous run still working? allow | forbid | replace
    max_concurrent_runs: null                  # no limit on runs at the same time
    deadline_factor: 6                         # a run is stopped after this × its normal time
    checkpoint: false                          # keep finished work when a pod is killed?
    memory: {request: 256Mi, limit: 1Gi, base: 200Mi, peak: 400Mi, shape: ramp} # memory: booked, max, at start, peak, how it grows
    health: {metric: runtime_ratio, threshold: 1.5} # unhealthy if a run takes > 1.5 × its normal time
  - name: training
    type: batch
    team: data                                 # who owns it
    every: 45m                                 # a new run is due this often
    first: 5m                                  # the first run is due at this time
    jitter: 0m                                 # each run starts up to this much later (random, from the seed)
    work: {units: 105, unit: chunk, cost_per_unit: 10s} # 105 × 10 s = 1050 CPU-s → normal run ≈ 8.8 min on 2 cores
    work_spread: 0%                            # each run gets ± this much work (random, from the seed)
    parallelism: 1                             # pods working on one run
    intensity: 2.0                             # cores each pod tries to use
    request: 1000m                             # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: normal                           # high | normal | low (who may push out whom)
    concurrency_policy: allow                  # previous run still working? allow | forbid | replace
    max_concurrent_runs: null                  # no limit on runs at the same time
    deadline_factor: 4                         # a run is stopped after this × its normal time
    checkpoint: false                          # keep finished work when a pod is killed?
    memory: {request: 256Mi, limit: 1Gi, base: 200Mi, peak: 400Mi, shape: ramp} # memory: booked, max, at start, peak, how it grows
    health: {metric: runtime_ratio, threshold: 1.5} # unhealthy if a run takes > 1.5 × its normal time
  - name: telemetry
    type: stream
    team: telemetry                            # who owns it
    base_rate: 150                             # events per second → 150 × 10 ms = 1.50 cores
    daily_pattern: flat                        # how the level changes over the day
    bursts: null                               # no bursts
    work_per_event: 10ms                       # CPU work for one event
    partitions: 2                              # events are split over this many partitions
    consumers: [2, 2]                          # [min, max] consumer pods
    threads_per_consumer: 1                    # events one consumer pod handles at once
    prefetch: 50                               # events a consumer takes at once
    scaler: {name: none}                       # how pods are added and removed
    request: 250m                              # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: normal                           # high | normal | low (who may push out whom)
    memory: {request: 128Mi, limit: 512Mi, base: 100Mi, per_buffered_event: 2Ki} # memory: booked, max, base, per waiting event
    health: {metric: event_age, threshold: 30s} # unhealthy if the oldest event waits > 30s
  - name: shop-users
    type: users
    team: webshop                              # who owns it
    users: 25                                  # users when the day pattern is 1.0 → each ≈ 0.98 requests/s × 20 ms = 0.49 cores
    daily_pattern: flat                        # how the level changes over the day
    peaks: []                                  # extra busy periods, e.g. [{at: 40m, x: 4, length: 15m}]
    think_time: 1s                             # each user waits this long between requests
    cost_per_request: 20ms                     # CPU work for one request
    timeout: 5s                                # a user gives up (error) after this long
    shop_replicas: [1, 1]                      # [min, max] shop pods
    scaler: {name: none}                       # how pods are added and removed
    request: 250m                              # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: normal                           # high | normal | low (who may push out whom)
    memory: {request: 128Mi, limit: 256Mi, base: 90Mi, per_in_flight: 1Mi} # memory: booked, max, base, per request in flight
    health: {metric: latency_p95, threshold: 300ms, window: 60s, errors_max: 1%} # unhealthy if p95 > 300ms or errors > 1%
