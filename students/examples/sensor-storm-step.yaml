# WORKED EXAMPLE (step scaler). A copy of scenarios/sensor-storm.yaml with ONE change: the telemetry scaler.
# Same seed (42) = the same bursts at the same minutes, so a difference in the results comes from the scaler.
#   python -m loadkit run students/examples/sensor-storm-step.yaml        (headless)
#   compare with: python -m loadkit run sensor-storm, then python -m loadkit compare <run-a> <run-b>
name: sensor-storm-step
description: (step scaler example) Sensor bursts arrive; the autoscaler adds consumers on a node that is already busy.
story: The factory's sensors send a storm of readings a few times an hour. The consumers scale up to keep up — on the same machine as the shop.
look_for:
  - replicas jump at each burst (backlog wins over CPU in the scaler decision)
  - the extra consumers stay for minutes after the burst (stabilization window)
  - the shop slows during and after the bursts although its traffic did not change
duration: 2h                                   # how long the scenario runs
day_length: 2h                                 # a 24 h day is squeezed into this time
day_start_hour: 9                              # day time when the scenario starts
seed: 42                                       # day number for the random choices (same seed = same plan)
capacity_hint: {cpu: 6, memory: 16Gi}          # the machine size this scenario is written for
preemption: off                                # may high-priority pods push out lower-priority ones?
placement: {mode: together}                    # together = all pods on one machine
loads:
  - name: telemetry
    type: stream
    team: telemetry                            # who owns it
    base_rate: 100                             # events per second → 100 × 8 ms = 0.80 cores
    daily_pattern: flat                        # how the level changes over the day
    bursts: {per_hour: 2, x: 6, length: [3m, 6m]} # random/fixed bursts: per_hour, x = how many times more events, length
    work_per_event: 8ms                        # CPU work for one event
    partitions: 12                             # events are split over this many partitions
    consumers: [2, 12]                         # [min, max] consumer pods
    threads_per_consumer: 1                    # events one consumer pod handles at once
    prefetch: 50                               # events a consumer takes at once
    # CONNECTION 3 (step example): the scenario picks the scaler BY NAME. The engine looks up "step" on the list.
    scaler: {name: step, signal: backlog, cooldown: 60s, steps: [{above: 2000, change: 4}, {above: 500, change: 2}, {below: 100, change: -1}]}
    request: 250m                              # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: normal                           # high | normal | low (who may push out whom)
    memory: {request: 128Mi, limit: 512Mi, base: 100Mi, per_buffered_event: 2Ki} # memory: booked, max, base, per waiting event
    health: {metric: event_age, threshold: 30s} # unhealthy if the oldest event waits > 30s
  - name: shop-users
    type: users
    team: webshop                              # who owns it
    users: 60                                  # users when the day pattern is 1.0 → each ≈ 0.98 requests/s × 20 ms = 1.18 cores
    daily_pattern: office-day                  # how the level changes over the day
    peaks: []                                  # extra busy periods, e.g. [{at: 40m, x: 4, length: 15m}]
    think_time: 1s                             # each user waits this long between requests
    cost_per_request: 20ms                     # CPU work for one request
    timeout: 5s                                # a user gives up (error) after this long
    shop_replicas: [2, 6]                      # [min, max] shop pods
    scaler: {name: concurrency, target_in_flight: 4, stabilization: 5m} # how pods are added and removed
    request: 500m                              # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: high                             # high | normal | low (who may push out whom)
    memory: {request: 128Mi, limit: 256Mi, base: 90Mi, per_in_flight: 1Mi} # memory: booked, max, base, per request in flight
    health: {metric: latency_p95, threshold: 300ms, window: 60s, errors_max: 1%} # unhealthy if p95 > 300ms or errors > 1%
  - name: report
    type: batch
    team: finance                              # who owns it
    every: 30m                                 # a new run is due this often
    first: 12m                                 # the first run is due at this time
    jitter: 5m                                 # each run starts up to this much later (random, from the seed)
    work: {units: 1200, unit: order-batch, cost_per_unit: 0.5s} # 1200 × 0.5 s = 600 CPU-s → normal run ≈ 10.0 min on 1 core
    work_spread: 0%                            # each run gets ± this much work (random, from the seed)
    parallelism: 1                             # pods working on one run
    intensity: 1.0                             # cores each pod tries to use
    request: 250m                              # CPU the pod books = its share when the machine is full
    limit: none                                # no CPU cap: may use free cores
    priority: normal                           # high | normal | low (who may push out whom)
    concurrency_policy: allow                  # previous run still working? allow | forbid | replace
    max_concurrent_runs: null                  # no limit on runs at the same time
    deadline_factor: 4                         # a run is stopped after this × its normal time
    checkpoint: false                          # keep finished work when a pod is killed?
    memory: {request: 256Mi, limit: 1Gi, base: 200Mi, peak: 400Mi, shape: ramp} # memory: booked, max, at start, peak, how it grows
    health: {metric: runtime_ratio, threshold: 1.5} # unhealthy if a run takes > 1.5 × its normal time
